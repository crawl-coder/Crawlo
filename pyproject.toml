[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# pytest-asyncio 1.0+ 默认 strict 模式要求 @pytest.mark.asyncio，
# 项目中大量测试使用裸 async def 作为测试用例（无显式装饰器），
# 设为 auto 以兼容旧写法，保持兼容。
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# collect_ignore_glob 已迁移至 tests/conftest.py（路径相对于 conftest.py 所在目录更可靠）

# ====================
# Phase 4: Coverage 基础设施
# ====================
# 运行时：pytest --cov 即启用。日常本地不加 --cov 保持速度。
# CI 中：pytest --cov --cov-report=xml --cov-report=term-missing
addopts = ""
filterwarnings = [
    # P0-A2：crawlo 命名空间的 DeprecationWarning 一律视为错误。
    # 仅兼容 shim 验收测试（测试对象就是旧路径本身）可用 pytestmark 显式豁免。
    "error::DeprecationWarning",
]
markers = [
    "browser: heavy browser / live-network integration tests (skipped in CI)",
]

[tool.ruff.lint.per-file-ignores]
# 惰性加载（__getattr__）模式：__all__/延迟导入中的名字在运行时解析
"crawlo/core/factories.py" = ["F822"]
"crawlo/utils/__init__.py" = ["F401"]

[tool.coverage.run]
# 只测 crawlo 核心包，examples/scripts/tests/docs 不入覆盖率
source = ["crawlo"]
branch = true
omit = [
    "crawlo/__main__.py",
    "crawlo/_version*.py",
    "crawlo/**/__pycache__/*",
    # 以下是纯模板/脚手架代码，不计入覆盖率
    "crawlo/templates/**",
    # CLI 入口（主功能由 commands/ 层保障），可选先放轻量门槛
    "crawlo/cli.py",
]
dynamic_context = "test_function"
# crawlo/tests 均未使用 greenlet/gevent；greenlet 曾导致 CI 在缺模块时
# 启动即 ConfigError（Couldn't trace with concurrency=greenlet），已移除。
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
# 百分号整数 + 未覆盖行号，便于从终端日志看到缺口
show_missing = true
skip_covered = false
skip_empty = false
precision = 2
exclude_lines = [
    # 典型覆盖率排除
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
    "pass",
    "\\.\\.\\.",
    # 框架内部的 Deprecation 存根重定向，不计覆盖
    "sys\\.modules\\[__name__\\] = ",
    "warnings\\.warn\\(.*DeprecationWarning",
]

[tool.importlinter]
root_package = "crawlo"

# 分层契约：上层可导入下层，下层禁止反向导入上层。
# 当前存在大量违规（延迟导入），先全部列入 ignore_imports 白名单，
# Phase 5 逐条清零后删除白名单条目。
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "crawlo.commands | crawlo.shell | crawlo.mcp | crawlo.cli",
    "crawlo.crawler_process | crawlo.crawler | crawlo.framework",
    "crawlo.core",
    "crawlo.downloader | crawlo.middleware | crawlo.pipelines | crawlo.spider | crawlo.extensions | crawlo.checkpoint",
    "crawlo.queue | crawlo.network | crawlo.filters | crawlo.items | crawlo.backpressure | crawlo.cluster | crawlo.stats | crawlo.helpers",
    "crawlo.settings | crawlo.utils | crawlo.logging",
]
# Phase 0 白名单：当前所有违规导入（含同层互相导入 + 反向依赖）。
# Phase 5 逐条清零，每修一处删一条。
ignore_imports = [
    "crawlo.backpressure.interfaces -> crawlo.queue.interfaces",
    "crawlo.backpressure.strategies -> crawlo.queue.interfaces",
    # Phase 9.5: 各领域子模块继承 core.exceptions 中的基础异常（合法的异常共享，非领域耦合），
    # v2.0 前不会删除 crawlo.core.exceptions，条目保留到 v2.0 后再评估是否上移/拆分。
    "crawlo.middleware.offsite -> crawlo.core.exceptions",
    "crawlo.utils.func_tools -> crawlo.core.exceptions",
    "crawlo.utils.errors -> crawlo.core.exceptions",
    "crawlo.utils.errors.error_handler -> crawlo.core.exceptions",
    "crawlo.queue.exceptions -> crawlo.core.exceptions",
    "crawlo.network.exceptions -> crawlo.core.exceptions",
    "crawlo.spider.exceptions -> crawlo.core.exceptions",
    "crawlo.items.exceptions -> crawlo.core.exceptions",
    # Phase 9.5: middleware 延迟使用 core 异常与 crawlo.config（应用编排层的合法共享）。
    # 这些延迟导入仅在 ``MiddlewareManager`` 初始化时触发，不影响架构分层。
    "crawlo.middleware.middleware_manager -> crawlo.core.exceptions",
    "crawlo.cli -> crawlo.commands",
    "crawlo.commands.shell -> crawlo.shell.core",
    "crawlo.crawler_process -> crawlo.crawler",
    "crawlo.downloader -> crawlo.middleware.middleware_manager",
    "crawlo.downloader.aiohttp_downloader -> crawlo.crawler",
    "crawlo.extensions.monitor.monitor_manager -> crawlo.core.application",
    "crawlo.extensions.monitor.performance_monitor -> crawlo.core.application",
    "crawlo.filters.aioredis_filter -> crawlo.crawler",
    "crawlo.filters.aioredis_filter -> crawlo.network.request",
    "crawlo.framework -> crawlo.crawler",
    "crawlo.network.response_adaptive -> crawlo.helpers.adaptive_selector",
    # v2.0: CrawloConfig 迁移到 crawlo.core.config 后的跨层引用
    #（project / bot 延迟使用配置类，合法的编排层 → core 依赖）
    "crawlo.project -> crawlo.core.config",
    # v2.0: SingletonMeta 迁移到 crawlo.core.singleton 后的跨层引用
    #（logging 层使用单例元类，合法的工具依赖）
    "crawlo.logging.manager -> crawlo.core.singleton",
    # Phase 5: pipelines 仅类型注解用 Spider（TYPE_CHECKING 块 + from __future__ import annotations）
    "crawlo.pipelines.base_pipeline -> crawlo.spider",
    "crawlo.pipelines.console -> crawlo.spider",
    "crawlo.pipelines.dedup.mysql -> crawlo.spider",
    # Phase 9.5: 领域子模块 import core.exceptions（异常继承/使用，合法共享）与
    #            interfaces 在 TYPE_CHECKING/体内 引用 crawler（仅注解用途）。
    # v2.0 后再评估异常是否上移 / crawler 类型标注是否继续保留。
    "crawlo.core.interfaces -> crawlo.crawler",
    "crawlo.middleware.interfaces -> crawlo.crawler",
    "crawlo.middleware.default_header -> crawlo.core.exceptions",
    "crawlo.downloader.interfaces -> crawlo.crawler",
    "crawlo.extensions.interfaces -> crawlo.crawler",
    "crawlo.extensions -> crawlo.core.exceptions",
    "crawlo.extensions.logging -> crawlo.core.exceptions",
    "crawlo.extensions.request_recorder -> crawlo.core.exceptions",
    "crawlo.extensions.monitor.base -> crawlo.core.exceptions",
    "crawlo.pipelines.sql.postgresql -> crawlo.core.exceptions",
    "crawlo.pipelines.manager -> crawlo.core.exceptions",
    "crawlo.queue.memory_queue -> crawlo.backpressure.intelligent_calculator",
    "crawlo.queue.memory_queue -> crawlo.backpressure.metrics_collector",
    "crawlo.queue.memory_queue -> crawlo.backpressure.monitor",
    "crawlo.queue.queue_backpressure -> crawlo.backpressure",
    "crawlo.queue.queue_manager -> crawlo.backpressure",
    "crawlo.queue.redis_priority_queue -> crawlo.core.application",
    # Phase 3.6：scheduling/ 业务代码已迁移到 commands/（L1），原 L4→L1/L3 反向依赖白名单失效。
    # commands.cleanup → extensions.monitor、commands.scheduler → commands.job_executor、
    # commands.registry → core.application 均为 L1→L4/L1/L3 合法向下依赖，无需白名单。
    # Phase 9.5: spider.loader 已切到 crawlo.spider.interfaces，原旧路径白名单失效
    # "crawlo.spider.loader -> crawlo.interfaces",
    "crawlo.spider.loader -> crawlo.spider.interfaces",
    "crawlo.spider.spider -> crawlo.core.application",
    "crawlo.spider.spider -> crawlo.crawler",
    "crawlo.utils -> crawlo.middleware.priority",
    "crawlo.utils.batch.batch_manager -> crawlo.logging",
    "crawlo.utils.batch.batch_processor -> crawlo.logging",
    "crawlo.utils.parsing.curl_parser -> crawlo.logging",
    "crawlo.utils.parsing.curl_parser -> crawlo.network.request",
    "crawlo.utils.db.database_connection_pool -> crawlo.logging",
    "crawlo.utils.db.mongo_connection_pool -> crawlo.logging",
    "crawlo.utils.db.mysql_connection_pool -> crawlo.logging",
    "crawlo.utils.db.mysql_helper -> crawlo.logging",
    "crawlo.utils.db.mysql_helper -> crawlo.settings.setting_manager",
    "crawlo.utils.db.sql_builder -> crawlo.logging",
    "crawlo.utils.errors.error_handler -> crawlo.core.application",
    "crawlo.utils.errors.error_handler -> crawlo.logging",
    "crawlo.utils.misc -> crawlo.spider",
    "crawlo.utils.concurrency.process_utils -> crawlo.crawler",
    "crawlo.utils.concurrency.process_utils -> crawlo.settings.setting_manager",
    "crawlo.utils.concurrency.process_utils -> crawlo.spider",
    "crawlo.utils.redis.keys -> crawlo.logging",
    "crawlo.utils.redis.pool -> crawlo.core.application",
    "crawlo.utils.redis.pool -> crawlo.logging",
    "crawlo.utils.request.request_serializer -> crawlo.logging",
    "crawlo.utils.request.request_serializer -> crawlo.network.request",
    "crawlo.utils.request.request_serializer -> crawlo.spider",
    "crawlo.utils.resource_manager -> crawlo.core.application",
    "crawlo.utils.resource_manager -> crawlo.logging",
    # 根包 __getattr__ 惰性导入导致的间接依赖
    "crawlo -> crawlo.helpers",
    "crawlo -> crawlo.helpers.time_utils",
    # Phase 4 Step 3：get_framework_initializer() facade 转发到 crawlo.core（lazy）
    "crawlo -> crawlo.core",
    "crawlo.utils.func_tools -> crawlo",
    "crawlo.utils.request.request -> crawlo",
    "crawlo.queue.redis_stream_queue -> crawlo",
]
