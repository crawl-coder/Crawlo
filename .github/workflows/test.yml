name: CI

on:
  push:
    branches: [main, master, develop, develop_distributed]
  pull_request:
    branches: [main, master, develop]

# 同一分支新提交到达时取消正在跑的旧 run，避免排队浪费 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：单元 + 架构守护（无外网依赖，确定性高），覆盖 2 个代表性 Python 版本
  test:
    name: Test Python ${{ matrix.python-version }} (unit + arch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # 最旧支持版本 / 主流版本（3.11/3.13 与相邻版本行为一致，不重复跑全量；
        # 3.14 暂不纳入：inspect.signature 输出差异导致签名哈希基线不兼容，
        # 且 CI 上存在未定位的挂起（>30min 超时），待 3.14 专项修复后再加回）
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装基础依赖 + 核心测试所需的可选依赖：
          #   monitoring → prometheus-client（test_prometheus_backend）
          #   mcp        → mcp 包（test_mcp_server）
          #   sqlite     → aiosqlite（可选）
          # 不装 [all]：playwright/camoufox/cloakbrowser 等重型浏览器依赖在 CI 中
          # 需额外下载二进制，且核心单元测试不依赖它们。
          pip install -e ".[monitoring,mcp,sqlite]"
          # ruff/mypy/bandit 在独立的 lint job 运行，test job 不需要
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit + arch tests with coverage
        run: |
          # coverage 门槛（tests/arch/test_coverage_gate.py）依赖本 job 的实时覆盖率
          python -m pytest \
            tests/unit tests/arch \
            -m "not browser" \
            --cov=crawlo \
            -q --tb=short

  # 集成测试：单版本（3.12），排除外网真实站点（realsite）保证确定性
  integration:
    name: Integration (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[monitoring,mcp,sqlite]"
          pip install pytest pytest-asyncio

      - name: Run integration tests (no external-site dependency)
        run: |
          python -m pytest \
            tests/integration \
            -m "not browser and not realsite" \
            -q --tb=short

  lint:
    name: Lint / Type / Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff mypy bandit
      - name: Ruff (pyflakes real-bug rules)
        run: ruff check crawlo --select F --ignore F821
      - name: Bandit security scan
        # skip 清单（已从 13 类缩减到 2 类）：
        #   B608 参数化 SQL f-string（6 处，字符串行无法加 nosec，表/列名来自配置无注入面）
        #   B105 默认密码/密钥字面量（1 处 Lua 脚本字符串误报）
        # B110（188 处 except-pass）已全部转为 debug 日志，不再需要 skip。
        run: bandit -r crawlo -s B608,B105
      - name: Mypy incremental (core modules)
        # 已清零（crawlo/core + queue + cluster 0 errors），转强制守护
        run: mypy crawlo/core crawlo/queue crawlo/cluster --ignore-missing-imports --follow-imports=skip --no-error-summary

  release-check:
    name: Release readiness (P0-A4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR 合入 main + 版本 tag 推送时强制发布纪律检查
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Release readiness check (dry-run)
        # 校验：semver 版本号 + CHANGELOG 条目 + docs/releases 发布说明 + git tag 一致性
        run: |
          crawlo release --dry-run
