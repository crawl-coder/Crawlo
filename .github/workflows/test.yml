name: CI

on:
  push:
    branches: [main, master, develop, develop_distributed]
  pull_request:
    branches: [main, master, develop]

# 同一分支新提交到达时取消正在跑的旧 run，避免排队浪费 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：单元 + 架构守护（无外网依赖，确定性高），覆盖 3 个代表性 Python 版本
  test:
    name: Test Python ${{ matrix.python-version }} (unit + arch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # 最旧支持版本 / 主流版本 / 最新版本（3.11/3.13 与相邻版本行为一致，不重复跑全量）
        # 3.14 已修复：签名哈希跨版本归一化 + asyncio.iscoroutinefunction 弃用替换
        python-version: ["3.10", "3.12", "3.14"]
        include:
          # coverage 门槛与版本无关，只在 3.12 一份即可（省去 3.10/3.14 的重复采集开销）
          - python-version: "3.12"
            coverage: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装基础依赖 + 核心测试所需的可选依赖：
          #   monitoring → prometheus-client（test_prometheus_backend）
          #   mcp        → mcp 包（test_mcp_server）
          #   sqlite     → aiosqlite（可选）
          # 不装 [all]：playwright/camoufox/cloakbrowser 等重型浏览器依赖在 CI 中
          # 需额外下载二进制，且核心单元测试不依赖它们。
          pip install -e ".[monitoring,mcp,sqlite]"
          # ruff/mypy/bandit 在独立的 lint job 运行，test job 不需要
          # pytest-timeout：单用例超时保护，防止个别环境导致的挂起拖死整个 job
          pip install pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Run unit + arch tests
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          # coverage 门槛（tests/arch/test_coverage_gate.py）依赖实时覆盖率，
          # 仅 3.12 开启（matrix.coverage=true），其余版本跳过以节省时间
          COV_FLAG=""
          if [ "$COVERAGE" = "true" ]; then COV_FLAG="--cov=crawlo"; fi
          python -m pytest \
            tests/unit tests/arch \
            -m "not browser" \
            $COV_FLAG \
            --timeout=300 \
            -q --tb=short

  # 集成测试：单版本（3.12），排除外网真实站点（realsite）保证确定性
  integration:
    name: Integration (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[monitoring,mcp,sqlite]"
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run integration tests (no external-site dependency)
        run: |
          python -m pytest \
            tests/integration \
            -m "not browser and not realsite" \
            --timeout=300 \
            -q --tb=short

  lint:
    name: Lint / Type / Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff mypy bandit
      - name: Ruff (pyflakes real-bug rules)
        run: ruff check crawlo --select F --ignore F821
      - name: Bandit security scan
        # skip 清单（已从 13 类缩减到 2 类）：
        #   B608 参数化 SQL f-string（6 处，字符串行无法加 nosec，表/列名来自配置无注入面）
        #   B105 默认密码/密钥字面量（1 处 Lua 脚本字符串误报）
        # B110（188 处 except-pass）已全部转为 debug 日志，不再需要 skip。
        run: bandit -r crawlo -s B608,B105
      - name: Mypy incremental (core modules)
        # 已清零（crawlo/core + queue + cluster 0 errors），转强制守护
        run: mypy crawlo/core crawlo/queue crawlo/cluster --ignore-missing-imports --follow-imports=skip --no-error-summary

  release-check:
    name: Release readiness (P0-A4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR 合入 main + 版本 tag 推送时强制发布纪律检查
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Release readiness check (dry-run)
        # 校验：semver 版本号 + CHANGELOG 条目 + docs/releases 发布说明 + git tag 一致性
        run: |
          crawlo release --dry-run
